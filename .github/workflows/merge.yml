name: Merge checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Both supported majors. jsdom 30 needs >= 22.22.2, so 22.x must
        # resolve to a recent 22 — see "engines" in package.json.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Audit production dependencies
        if: matrix.node-version == '24.x'
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run release:minified

      - name: Install Chromium
        if: matrix.node-version == '24.x'
        run: npx playwright install --with-deps chromium

      - name: Check pages and lazy widget loading
        if: matrix.node-version == '24.x'
        run: npm run test:browser
